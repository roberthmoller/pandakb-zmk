include:
# Match PandaKBLab/zmk-for-keyboards zmk-for-lily base (plain halves, no nice_oled).
  - board: nice_nano_v2
    shield: Lily58_L
    snippet: studio-rpc-usb-uart
    artifact-name: Lily58_left
  - board: nice_nano_v2
    shield: Lily58_R
    artifact-name: Lily58_right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset

# Lily58 without dongle + OLED extras
  # Lily58 with oled display(with nice_oled module)
  # nice_oled provides a custom status screen; override base BUILT_IN to avoid duplicate symbols.
  - board: nice_nano_v2 
    shield: Lily58_L nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
    artifact-name: Lily58_left_oled
  - board: nice_nano_v2
    shield: Lily58_R nice_oled
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
    artifact-name: Lily58_right_oled
  # Diagnostic bare right (no OLED/RGB)
  - board: nice_nano_v2
    shield: Lily58_R bare_right
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_WS2812_STRIP=n -DCONFIG_EC11=n
    artifact-name: Lily58_right_bare
  # Lily58 with nice!view display(with nice_view_custom module) 适用于带nice_view的Lily58
  - board: nice_nano_v2
    shield: Lily58_L Nice_view_config nice_view_custom
    snippet: studio-rpc-usb-uart
    artifact-name: Lily58_left_nice_view
  - board: nice_nano_v2
    shield: Lily58_R Nice_view_config nice_view_custom
    artifact-name: Lily58_right_nice_view


#Lily58 with dongle 带dongle的Lily58
  # dongle with LCD display 带LCD显示的dongle
  - board: nice_nano_v2
    shield: Lily58_dongle_central dongle_screen
    snippet: studio-rpc-usb-uart
    artifact-name: Lily58_central_dongle_LCD
# dongle with oled from eyeslash 适配睫毛哥家的oled_dongle
  - board: nice_nano_v2
    shield: Lily58_dongle_central eyeslash_dongle_config dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: Lily58_central_dongle_eyeslash
  # peripheral with oled display(with nice_oled module)
  - board: nice_nano_v2
    shield: Lily58_dongle_left nice_oled
    artifact-name: Lily58_peripheral_left_oled
  - board: nice_nano_v2
    shield: Lily58_dongle_right nice_oled
    artifact-name: Lily58_peripheral_right_oled   
  # peripheral with nice!view display(with nice_view_custom module)
  - board: nice_nano_v2
    shield: Lily58_dongle_left Nice_view_config nice_view_custom
    artifact-name: Lily58_peripheral_left_nice_view
  - board: nice_nano_v2
    shield: Lily58_dongle_right Nice_view_config nice_view_custom
    artifact-name: Lily58_peripheral_right_nice_view
