CONFIG_PANDAKB_APP_LAYER=y
CONFIG_PANDAKB_GAME_BADGE_SCREEN=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Blanking cuts continuous I2C traffic on the peripheral half.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Keep LVGL/OLED off the system work queue so kscan/BLE stay responsive.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
