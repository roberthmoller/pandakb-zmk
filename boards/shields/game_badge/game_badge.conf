CONFIG_PANDAKB_APP_LAYER=y
CONFIG_PANDAKB_GAME_BADGE_SCREEN=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Blanking cuts continuous I2C traffic on the peripheral half.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Keep LVGL/OLED off the system work queue so kscan/BLE stay responsive.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Portrait canvas + rotate needs a bit more UI stack than labels alone.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2560
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_12=y
